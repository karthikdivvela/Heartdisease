services:
  heart-api:
    image: heart-api:latest
    ports: ["8000:8000"]
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [heart-api]
  grafana:
    image: grafana/grafana:latest
    network_mode: host
    depends_on: [prometheus]
