name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 src app tests scripts

      - name: Unit tests
        run: pytest -v --junitxml=reports/junit.xml

      - name: Train models (fails the pipeline on any error)
        run: python -m src.train
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-artifacts
          path: |
            models/
            reports/junit.xml
            reports/plots/
            mlflow.db

  docker:
    needs: build-test-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t heart-api:ci .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api heart-api:ci
          for i in $(seq 1 15); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}'
      - name: Container logs
        if: always()
        run: docker logs api
